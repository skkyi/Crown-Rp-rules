<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkY?</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background-color: #030303;
            background-image:
                radial-gradient(circle at 12% 30%, rgba(255,255,255,0.05), transparent 40%),
                radial-gradient(circle at 88% 78%, rgba(120,40,60,0.10), transparent 45%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        #particleCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* --- شاشة الترحيب --- */
        #intro-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #000000;
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 1.5s ease;
        }
        .intro-text {
            color: #ffffff;
            font-size: 24px;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 2px;
            border-right: 2px solid #fff;
            padding-right: 5px;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: intro-typing 1.5s steps(20, end) forwards;
        }
        @keyframes intro-typing { from { width: 0 } to { width: 330px; } }

        /* --- الكارد الأفقي الزجاجي --- */
        .card {
            position: relative;
            z-index: 10;
            width: min(92vw, 720px);
            display: flex;
            align-items: center;
            gap: 26px;
            padding: 26px 30px;
            border-radius: 22px;
            background: linear-gradient(155deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015) 55%, rgba(255,255,255,0.03));
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow:
                0 30px 70px rgba(0,0,0,0.85),
                inset 0 1px 1px rgba(255,255,255,0.12),
                inset 0 -1px 1px rgba(0,0,0,0.5);
        }
        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 6%; right: 6%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
        }

        .card-footer {
            position: absolute;
            bottom: 14px; left: 30px; right: 30px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .dev-by {
            font-size: 11px; color: #808080; font-weight: 600; letter-spacing: 1px;
        }
        .avatar-wrapper {
            position: relative;
            width: 108px; height: 108px;
            flex-shrink: 0;
        }
        .avatar-wrapper::before {
            content: "";
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%);
            filter: blur(6px);
        }
        .avatar-wrapper img {
            position: relative;
            width: 108px; height: 108px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.9);
            box-shadow: 0 0 25px rgba(255,255,255,0.25);
        }

        /* عمود المعلومات */
        .info { flex: 1; min-width: 0; }
        .name-row {
            display: flex; align-items: baseline; gap: 10px;
            margin-bottom: 12px;
        }
        .name-row .name {
            font-size: 24px;
            font-weight: 700;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 1px;
        }
        .name-row .tag {
            font-size: 12px;
            color: #808080;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* اسم Sky بشكل كود برمجي يتكتب */
        .code-name {
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            white-space: pre;
        }
        .code-name .syntax {
            color: #808080;
            font-weight: 600;
        }
        .code-cursor {
            display: inline-block;
            width: 9px; height: 22px;
            background: #ffffff;
            margin-right: 2px;
            vertical-align: middle;
            animation: blink 0.9s infinite;
        }

        .icon-row { display: flex; gap: 10px; margin-bottom: 14px; }
        .icon-badge {
            width: 34px; height: 34px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            display: grid;
            place-items: center;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .icon-badge svg { width: 16px; height: 16px; }
        .icon-badge:hover {
            background: #ffffff; color: #000000;
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(255,255,255,0.25);
        }

        .status-line {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #cfcfcf;
            border-right: none;
        }
        .status-line .cursor {
            display: inline-block;
            width: 7px; height: 15px;
            background: #ffffff;
            margin-right: 4px;
            vertical-align: middle;
            animation: blink 0.9s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .divider {
            grid-column: 1 / -1;
            margin-top: 18px;
            border: none;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        @media (max-width: 560px) {
            .card { flex-direction: column; text-align: center; padding: 32px 22px 26px; }
            .name-row, .icon-row { justify-content: center; }
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div id="intro-screen">
        <div class="intro-text">Welcome to Info Sky</div>
    </div>

    <div class="card">
        <div class="avatar-wrapper">
            <img src="profile.webp" alt="SKy Profile">
        </div>

        <div class="info">
            <div class="name-row">
                <span class="code-name" id="codeName"></span><span class="code-cursor"></span>
            </div>

            <div class="icon-row">
                <a href="https://discord.com/users/1187826589031989258" class="icon-badge" target="_blank" title="Discord">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 4.4A18.6 18.6 0 0 0 15.8 3c-.2.4-.5 1-.7 1.4a17.6 17.6 0 0 0-6.2 0c-.2-.4-.4-1-.7-1.4A18.6 18.6 0 0 0 3.7 4.4C1.2 8.1.5 11.7.8 15.3a18.7 18.7 0 0 0 5.7 2.9c.5-.6.9-1.3 1.2-2a12 12 0 0 1-1.9-.9c.2-.1.3-.3.5-.4a13.3 13.3 0 0 0 11.4 0c.2.1.3.3.5.4-.6.4-1.3.7-1.9.9.3.7.7 1.4 1.2 2a18.6 18.6 0 0 0 5.7-2.9c.4-4.2-.7-7.7-2.9-10.9ZM9.7 13.4c-.9 0-1.6-.9-1.6-1.9s.7-1.9 1.6-1.9 1.6.9 1.6 1.9-.7 1.9-1.6 1.9Zm5.6 0c-.9 0-1.6-.9-1.6-1.9s.7-1.9 1.6-1.9 1.6.9 1.6 1.9-.7 1.9-1.6 1.9Z"/></svg>
                </a>
                <a href="https://discord.gg/8ERgMXKs8K" class="icon-badge" target="_blank" title="Server">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a13 13 0 0 0 0 18 13 13 0 0 0 0-18Z"/><path d="M3 12h18"/></svg>
                </a>
                <a href="https://www.instagram.com/ry.i?igsh=MXMxYW41ZWs4MTIzYQ%3D%3D&utm_source=qr" class="icon-badge" target="_blank" title="Instagram">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
                </a>
                <a href="https://www.tiktok.com/@skywiithyou?_r=1&_t=ZS-95Y2co5BCqK" class="icon-badge" target="_blank" title="TikTok">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c.4 2.1 1.8 3.6 3.9 3.9v3c-1.4 0-2.7-.4-3.9-1.2v6.6a5.7 5.7 0 1 1-5.7-5.7c.3 0 .6 0 .9.1v3.1a2.7 2.7 0 1 0 1.9 2.6V3h2.9Z"/></svg>
                </a>
            </div>

            <div class="status-line">#69<span class="cursor"></span></div>
        </div>

        <hr class="divider">
    </div>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        const numberOfParticles = 70;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const mouse = { x: null, y: null };
        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.speedY = Math.random() * 0.8 - 0.4;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 120) {
                    this.x += dx * 0.02;
                    this.y += dy * 0.02;
                }

                if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 100) {
                        opacityValue = 1 - (distance / 100);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacityValue})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            connect();
            requestAnimationFrame(animate);
        }

        init();
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });

        // 4. كتابة اسم Sky بشكل كود برمجي (typing loop)
        const codeLines = [
            [{ t: 'const ', c: 'syntax' }, { t: 'dev', c: '' }, { t: ' = ', c: 'syntax' }, { t: '"Sky"', c: '' }, { t: ';', c: 'syntax' }],
            [{ t: 'Sky', c: '' }, { t: '.online()', c: 'syntax' }, { t: ';', c: 'syntax' }]
        ];
        const codeNameEl = document.getElementById('codeName');
        let lineIndex = 0;

        function flattenLine(parts) {
            return parts.map(p => ({ char: p.t, cls: p.c }));
        }

        function typeLine(parts, done) {
            let html = '';
            let charsAll = [];
            parts.forEach(p => {
                for (const ch of p.t) charsAll.push({ ch, cls: p.c });
            });
            let i = 0;
            const typeStep = () => {
                if (i <= charsAll.length) {
                    html = '';
                    let openSpan = false;
                    let currentCls = null;
                    for (let k = 0; k < i; k++) {
                        const item = charsAll[k];
                        if (item.cls !== currentCls) {
                            if (openSpan) html += '</span>';
                            if (item.cls) { html += `<span class="syntax">`; openSpan = true; }
                            else openSpan = false;
                            currentCls = item.cls;
                        }
                        html += item.ch;
                    }
                    if (openSpan) html += '</span>';
                    codeNameEl.innerHTML = html;
                    i++;
                    setTimeout(typeStep, 65 + Math.random() * 60);
                } else {
                    setTimeout(done, 1400);
                }
            };
            typeStep();
        }

        function eraseLine(done) {
            let text = codeNameEl.textContent;
            const eraseStep = () => {
                if (text.length > 0) {
                    text = text.slice(0, -1);
                    codeNameEl.textContent = text;
                    setTimeout(eraseStep, 35);
                } else {
                    setTimeout(done, 300);
                }
            };
            eraseStep();
        }

        function runCodeLoop() {
            typeLine(codeLines[lineIndex], () => {
                eraseLine(() => {
                    lineIndex = (lineIndex + 1) % codeLines.length;
                    runCodeLoop();
                });
            });
        }
        runCodeLoop();

        let titleText = "SkY? ";
        setInterval(() => {
            titleText = titleText.substring(1) + titleText.substring(0, 1);
            document.title = titleText;
        }, 300);

        window.addEventListener('load', () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-screen');
                intro.style.opacity = '0';
                setTimeout(() => {
                    intro.style.display = 'none';
                }, 1500);
            }, 2000);
        });
    </script>

</body>
</html>
